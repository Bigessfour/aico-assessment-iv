# Secret values are NOT stored in git.
# We create this at apply-time from Keychain (see scripts or kubectl create secret).
# This file documents the expected keys for reviewers.
apiVersion: v1
kind: Secret
metadata:
  name: fraud-aws-creds
  namespace: fraud
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_AT_APPLY_TIME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_AT_APPLY_TIME"
