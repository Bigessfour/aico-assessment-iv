# =============================================================================
# Service — stable virtual IP in front of fraud-api pods
# =============================================================================
# Talking points:
#   - ClusterIP: reachable only inside the cluster (good default for internal APIs).
#   - selector app=fraud-api: load-balances to matching Ready pods.
#   - port 80 → targetPort 8000: callers use :80; container still listens on 8000.
#   - Demo from laptop: kubectl -n fraud port-forward svc/fraud-api 18000:80
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: fraud
  labels:
    app: fraud-api
    team: fraud
spec:
  type: ClusterIP
  selector:
    app: fraud-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
