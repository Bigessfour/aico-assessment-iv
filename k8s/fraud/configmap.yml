# =============================================================================
# ConfigMap — non-secret configuration injected as environment variables
# =============================================================================
# Talking points:
#   - Safe to commit: endpoint name, region, timeouts are not credentials.
#   - Deployment uses envFrom.configMapRef → becomes process env in the pod.
#   - ENDPOINT_NAME MUST be aico-iv-fraud for this team (routing isolation).
#   - Change endpoint without rebuilding the image — just edit + kubectl apply.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config
  namespace: fraud
data:
  ENDPOINT_NAME: "aico-iv-fraud"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "info"
  INVOKE_TIMEOUT_SECONDS: "10"
  # Model version shown on the dashboard — bump here, no image rebuild.
  MODEL_VERSION: "fraud-xgboost-2026.09.1"
