# =============================================================================
# Ops dashboard Deployment — React static UI behind nginx
# =============================================================================
# Talking points:
#   - ClusterIP only (shared-cluster rule: avoid leftover LoadBalancers).
#   - Demo: kubectl -n platform port-forward svc/ops-dashboard 3000:80
#   - Browser hits /api/* → nginx → gateway → team services.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard
  namespace: platform
  labels:
    app: ops-dashboard
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-dashboard
  template:
    metadata:
      labels:
        app: ops-dashboard
        team: platform
    spec:
      containers:
        - name: ops-dashboard
          image: ghcr.io/bigessfour/ops-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ops-dashboard
  namespace: platform
  labels:
    app: ops-dashboard
    team: platform
spec:
  type: ClusterIP
  selector:
    app: ops-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
