# =============================================================================
# Gateway ConfigMap — team Service DNS + A/B weight (non-secret)
# =============================================================================
# Talking points:
#   - FRAUD_URL etc. use in-cluster DNS (no hardcoded pod IPs).
#   - WEIGHT_A splits traffic between the two variant labels below. Both hit the
#     same SageMaker endpoint today; the split and its counters are gateway-side.
#   - Change weight → kubectl apply → rollout restart deployment/gateway-api.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: platform
data:
  FRAUD_URL: "http://fraud-api.fraud.svc.cluster.local"
  RECOMMENDATIONS_URL: "http://recommendations-api.recommendations.svc.cluster.local"
  FORECASTING_URL: "http://forecasting-api.forecasting.svc.cluster.local"
  WEIGHT_A: "80"
  VARIANT_A_LABEL: "baseline"
  VARIANT_B_LABEL: "candidate"
  HTTP_TIMEOUT_SECONDS: "15"
  CORS_ORIGINS: "*"
