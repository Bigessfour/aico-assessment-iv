# =============================================================================
# Secret EXAMPLE — documents expected keys; DO NOT apply with real values in git
# =============================================================================
# Talking points:
#   - Secrets hold AWS keys the pod needs for sagemaker:InvokeEndpoint.
#   - Real values are created at apply-time from macOS Keychain, e.g.:
#       kubectl -n fraud create secret generic forecasting-aws-creds \
#         --from-literal=AWS_ACCESS_KEY_ID=... \
#         --from-literal=AWS_SECRET_ACCESS_KEY=...
#   - .gitignore blocks k8s/**/secret.yml so live secrets never get committed.
#   - Deployment mounts this via envFrom.secretRef (same env var names boto3 uses).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: forecasting-aws-creds
  namespace: forecasting
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_AT_APPLY_TIME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_AT_APPLY_TIME"
