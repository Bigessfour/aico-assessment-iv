# =============================================================================
# Service — stable virtual IP in front of forecasting-api pods
# =============================================================================
# Talking points:
#   - ClusterIP: reachable only inside the cluster (good default for internal APIs).
#   - selector app=forecasting-api: load-balances to matching Ready pods.
#   - port 80 → targetPort 8000: callers use :80; container still listens on 8000.
#   - Demo from laptop: kubectl -n fraud port-forward svc/forecasting-api 18000:80
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: forecasting-api
  namespace: forecasting
  labels:
    app: forecasting-api
    team: forecasting
spec:
  type: ClusterIP
  selector:
    app: forecasting-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
