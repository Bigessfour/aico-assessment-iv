# Dashboard nginx
#
# Talking points:
#   - Serves the Vite build as static files.
#   - Proxies /api/* to the in-cluster gateway so the browser only talks to
#     one origin (no CORS fights during kubectl port-forward demos).
#   - Static proxy_pass host is fine: pods restart after gateway is registered.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Strip /api prefix → gateway ClusterIP Service in namespace platform
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://gateway-api.platform.svc.cluster.local/;
        }
    }
}
