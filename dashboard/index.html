<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tailwind via CDN: satisfies the "clean styling" bonus without a heavy
      PostCSS pipeline in the nginx image. Fine for an internal ops UI.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Brand: cool slate + teal (avoid default purple/cream AI looks).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"IBM Plex Sans"', "system-ui", "sans-serif"],
              mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
            },
            colors: {
              ink: "#0f172a",
              panel: "#111827",
              accent: "#0d9488",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ML Platform Ops</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-display">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
