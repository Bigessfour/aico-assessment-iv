# Bonus: chain workflows — after CI succeeds on main, re-verify live pods.
# Does not rebuild images (avoids double GHCR cost when path-filtered deploy also runs).
name: Chain after CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: k8s-training-cluster

permissions:
  contents: read

jobs:
  verify-live:
    name: Post-CI cluster verify
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER}"

      - name: Run scripts/verify.sh
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh
