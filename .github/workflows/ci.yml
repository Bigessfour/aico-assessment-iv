# Lightweight PR checks — does NOT deploy to EKS.
# Full build/push/apply lives in deploy.yml (still a template until Phase 4).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate services + manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check FastAPI apps
        run: |
          set -e
          for svc in fraud-detection recommendations forecasting; do
            python -m py_compile "services/${svc}/app.py"
            echo "ok services/${svc}/app.py"
          done

      - name: Confirm required k8s manifests per team
        run: |
          set -e
          for team in fraud recommendations forecasting; do
            for f in namespace configmap deployment service quota secret.example; do
              test -f "k8s/${team}/${f}.yml"
              echo "ok k8s/${team}/${f}.yml"
            done
          done

      - name: Confirm History.md present
        run: test -f History.md && head -n 5 History.md
