# Lightweight PR checks — does NOT deploy to EKS.
# Full build/push/apply lives in deploy.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate services + manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check FastAPI apps
        run: |
          set -e
          # Team wrappers + platform gateway
          for svc in fraud-detection recommendations forecasting gateway; do
            python -m py_compile "services/${svc}/app.py"
            echo "ok services/${svc}/app.py"
          done

      - name: Confirm required k8s manifests per team
        run: |
          set -e
          for team in fraud recommendations forecasting; do
            for f in namespace configmap deployment service quota secret.example; do
              test -f "k8s/${team}/${f}.yml"
              echo "ok k8s/${team}/${f}.yml"
            done
          done
          for f in namespace configmap deployment-gateway service-gateway dashboard quota; do
            test -f "k8s/platform/${f}.yml"
            echo "ok k8s/platform/${f}.yml"
          done

      - name: Confirm dashboard sources present
        run: |
          test -f dashboard/src/App.jsx
          test -f dashboard/nginx.conf
          echo "ok dashboard"

      - name: Confirm History.md present
        run: test -f History.md && head -n 5 History.md

  # Rubric bonus "run tests". These are contract tests: they stub SageMaker and
  # httpx, so they prove the /health-/ready-/predict contract and the 502/504
  # failure paths without touching AWS or needing a cluster.
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest tests -q

  # A broken JSX edit would otherwise only surface during the image build in
  # deploy.yml, minutes later. Compiling the dashboard on the PR fails fast.
  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
