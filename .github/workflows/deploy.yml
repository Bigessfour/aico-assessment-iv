# Required CI/CD path: build → GHCR → EKS apply → verify.
# Does NOT create/destroy the class EKS cluster.
# Secrets are created from GitHub Actions secrets (never from secret.example.yml).
#
# Builds team wrappers + platform gateway + ops-dashboard.
# Branch targeting: workflow_dispatch input git_ref.
# Post-deploy verify: scripts/verify.sh (same script graders run locally).
# Chained workflows: chain-after-ci.yml runs after this workflow succeeds.
name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "dashboard/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      teams:
        description: "Comma-separated teams to deploy (default: all)"
        required: false
        default: "fraud,recommendations,forecasting"
      git_ref:
        description: "Git ref to build/deploy (branch, tag, or SHA). Empty = this workflow SHA."
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: k8s-training-cluster
  REGISTRY: ghcr.io
  IMAGE_OWNER: bigessfour

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # context differs for dashboard/ vs services/
          - service: fraud-detection
            context: services/fraud-detection
          - service: recommendations
            context: services/recommendations
          - service: forecasting
            context: services/forecasting
          - service: gateway
            context: services/gateway
          - service: ops-dashboard
            context: dashboard
    steps:
      - name: Resolve checkout ref
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.git_ref }}" ]; then
            REF="${{ github.event.inputs.git_ref }}"
            SHA=""
          else
            REF="${{ github.sha }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Checkout ref=$REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Finalize image SHA
        id: sha
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.image_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          echo "image_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Image tag SHA=$SHA"

      - name: Set up QEMU (amd64 on Actions runners is native; keep for consistency)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ steps.sha.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.git_ref }}" ]; then
            REF="${{ github.event.inputs.git_ref }}"
            SHA=""
          else
            REF="${{ github.sha }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Finalize image SHA
        id: sha
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.image_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          echo "image_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER}"

      - name: Resolve team list (allowlist)
        id: teams
        run: |
          set -euo pipefail
          ALLOWED="fraud recommendations forecasting"
          TEAMS="${{ github.event.inputs.teams }}"
          if [ -z "$TEAMS" ]; then
            TEAMS="fraud,recommendations,forecasting"
          fi
          OUT=""
          IFS=',' read -ra RAW <<< "$TEAMS"
          for team in "${RAW[@]}"; do
            team="$(echo "$team" | xargs)"
            case " $ALLOWED " in
              *" $team "*) ;;
              *)
                echo "Refusing unknown team '$team' (allowlist: $ALLOWED)"
                exit 1
                ;;
            esac
            if [ -n "$OUT" ]; then OUT="${OUT},"; fi
            OUT="${OUT}${team}"
          done
          echo "list=$OUT" >> "$GITHUB_OUTPUT"
          echo "Deploying teams: $OUT"

      - name: Ensure namespace secrets (AWS + GHCR pull)
        env:
          AWS_ACCESS_KEY_ID_VAL: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VAL: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TEAM_ARR <<< "${{ steps.teams.outputs.list }}"
          for team in "${TEAM_ARR[@]}"; do
            kubectl apply -f "k8s/${team}/namespace.yml"

            kubectl -n "$team" create secret generic "${team}-aws-creds" \
              --from-literal=AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID_VAL}" \
              --from-literal=AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY_VAL}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n "$team" create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${GHCR_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

          # platform: GHCR pull only (gateway does not call SageMaker directly)
          kubectl apply -f k8s/platform/namespace.yml
          kubectl -n platform create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${GHCR_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests (skip secret.example.yml)
        run: |
          set -euo pipefail
          IFS=',' read -ra TEAM_ARR <<< "${{ steps.teams.outputs.list }}"
          for team in "${TEAM_ARR[@]}"; do
            echo "=== apply $team ==="
            # ConfigMaps owned here (not Terraform) — single writer with demo-failure.sh
            kubectl apply -f "k8s/${team}/namespace.yml"
            kubectl apply -f "k8s/${team}/quota.yml"
            kubectl apply -f "k8s/${team}/configmap.yml"
            kubectl apply -f "k8s/${team}/deployment.yml"
            kubectl apply -f "k8s/${team}/service.yml"
          done

          echo "=== apply platform (gateway + dashboard) ==="
          kubectl apply -f k8s/platform/namespace.yml
          kubectl apply -f k8s/platform/quota.yml
          kubectl apply -f k8s/platform/configmap.yml
          kubectl apply -f k8s/platform/deployment-gateway.yml
          kubectl apply -f k8s/platform/service-gateway.yml
          kubectl apply -f k8s/platform/dashboard.yml

      - name: Pin deployments to this commit's image digest tag
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.image_sha }}"
          declare -A IMG=(
            [fraud]=fraud-detection
            [recommendations]=recommendations
            [forecasting]=forecasting
          )
          IFS=',' read -ra TEAM_ARR <<< "${{ steps.teams.outputs.list }}"
          for team in "${TEAM_ARR[@]}"; do
            image="${REGISTRY}/${IMAGE_OWNER}/${IMG[$team]}:${SHA}"
            kubectl -n "$team" set image "deployment/${team}-api" "${team}-api=${image}"
          done

          kubectl -n platform set image deployment/gateway-api \
            "gateway-api=${REGISTRY}/${IMAGE_OWNER}/gateway:${SHA}"
          kubectl -n platform set image deployment/ops-dashboard \
            "ops-dashboard=${REGISTRY}/${IMAGE_OWNER}/ops-dashboard:${SHA}"

      - name: Verify rollouts
        run: |
          set -euo pipefail
          IFS=',' read -ra TEAM_ARR <<< "${{ steps.teams.outputs.list }}"
          for team in "${TEAM_ARR[@]}"; do
            echo "=== rollout $team ==="
            kubectl -n "$team" rollout status "deployment/${team}-api" --timeout=180s
            kubectl -n "$team" get pods,svc
          done
          echo "=== rollout platform ==="
          kubectl -n platform rollout status deployment/gateway-api --timeout=180s
          kubectl -n platform rollout status deployment/ops-dashboard --timeout=180s
          kubectl -n platform get pods,svc

      - name: Verify isolation + health via scripts/verify.sh
        run: |
          chmod +x scripts/verify.sh
          TEAMS="${{ steps.teams.outputs.list }}" ./scripts/verify.sh
