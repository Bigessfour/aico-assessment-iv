# Lint Kubernetes manifests offline (no cluster required).
# Bonus: additional workflow for manifest lint.
name: Lint manifests

on:
  pull_request:
    paths:
      - "k8s/**"
      - ".github/workflows/lint-manifests.yml"
  workflow_dispatch:

jobs:
  lint:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          VER=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${VER}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate team + platform manifests
        run: |
          set -euo pipefail
          # Skip secret.example.yml from "must deploy" checks but still validate shape
          for team in fraud recommendations forecasting; do
            echo "=== $team ==="
            kubeconform -summary -strict -ignore-missing-schemas \
              "k8s/${team}/namespace.yml" \
              "k8s/${team}/quota.yml" \
              "k8s/${team}/configmap.yml" \
              "k8s/${team}/deployment.yml" \
              "k8s/${team}/service.yml" \
              "k8s/${team}/secret.example.yml"
          done
          echo "=== platform ==="
          kubeconform -summary -strict -ignore-missing-schemas \
            k8s/platform/namespace.yml \
            k8s/platform/quota.yml \
            k8s/platform/configmap.yml \
            k8s/platform/deployment-gateway.yml \
            k8s/platform/service-gateway.yml \
            k8s/platform/dashboard.yml
          echo "LINT OK"
